version: "3.8"

services:
  script:
    build: .
    volumes:
      - ./output:/app/output
    environment:
      - FUZZ=script
      - CXXFLAGS= -DRUST_BITCOIN -DRUST_MINISCRIPT -DBTCD -DBITCOIN_CORE -DLDK -DNLIGHTNING
    command: ["./bitcoinfuzz"]

  block_deserialization:
    build: .
    volumes:
      - ./output:/app/output
    environment:
      - FUZZ=block_deserialization
      - CXXFLAGS= -DRUST_BITCOIN -DRUST_MINISCRIPT -DBTCD -DBITCOIN_CORE -DLDK -DNLIGHTNING
    command: ["./bitcoinfuzz"]

  script_eval:
    build: .
    volumes:
      - ./output:/app/output
    environment:
      - FUZZ=script_eval
      - CXXFLAGS= -DRUST_BITCOIN -DRUST_MINISCRIPT -DBTCD -DBITCOIN_CORE -DLDK -DNLIGHTNING
    command: ["./bitcoinfuzz"]

  descriptor_parse:
    build: .
    volumes:
      - ./output:/app/output
    environment:
      - FUZZ=descriptor_parse
      - CXXFLAGS= -DRUST_BITCOIN -DRUST_MINISCRIPT -DBTCD -DBITCOIN_CORE -DLDK -DNLIGHTNING
    command: ["./bitcoinfuzz"]

  invoice_deserialization:
    build: .
    volumes:
      - ./output:/app/output
    environment:
      - FUZZ=invoice_deserialization
      - CXXFLAGS= -DLDK -DNLIGHTNING
    command: ["./bitcoinfuzz"]
